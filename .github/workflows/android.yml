name: VoidGram Android

# Builds the VoidGram APK: the pinned Telegram for Android source (android/upstream.json) with
# android/prepare.py applied. Standalone variant (installed by hand, no Google Play), armeabi-v7a +
# arm64-v8a. Pushes to main that touch android/** build it; it can also be started by hand.
on:
  push:
    branches: [main]
    paths:
      - android/**
      - assets/easter/**
      - .github/workflows/android.yml
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to attach the APK to (leave empty to keep it as an artifact only)
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: voidgram-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      ANDROID_NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Check Telegram credentials
        run: |
          test -n "$TELEGRAM_API_ID" -a -n "$TELEGRAM_API_HASH" || { echo "::error::TELEGRAM_API_ID / TELEGRAM_API_HASH secrets are missing"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch pinned Telegram for Android
        run: |
          set -euo pipefail
          repo=$(python3 -c 'import json; print(json.load(open("android/upstream.json"))["repository"])')
          commit=$(python3 -c 'import json; print(json.load(open("android/upstream.json"))["commit"])')
          git init -q telegram-android
          cd telegram-android
          git remote add origin "$repo"
          git fetch -q --depth 1 origin "$commit"
          git checkout -q FETCH_HEAD
          # Shallow submodules at their pinned commits; a server that refuses a commit by id gets a full clone.
          git submodule update --init --recursive --depth 1 --jobs 8 || git submodule update --init --recursive --jobs 8
          git log --oneline -1

      - name: Signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # With no ANDROID_KEYSTORE_BASE64 secret the APK is signed with the public test key from the
          # Telegram source: it installs, but anyone could sign an update with that key.
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > telegram-android/TMessagesProj/config/release.keystore
            echo "Using the VoidGram signing key"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: the APK is signed with Telegram's public test key"
          fi

      - name: Apply VoidGram
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: python3 android/prepare.py telegram-android

      - name: Android NDK and CMake
        run: |
          set -euo pipefail
          sdkmanager=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "ndk;${ANDROID_NDK_VERSION}" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0" >/dev/null
          df -h .

      - name: Build APK
        working-directory: telegram-android
        run: |
          set -euo pipefail
          # The runner has 16 GB: leave room for the native compilers next to Gradle.
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g/' gradle.properties
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :TMessagesProj_AppStandalone:assembleAfatStandalone

      - name: Collect APK
        run: |
          set -euo pipefail
          version=$(cat android/VERSION)
          apk=$(find telegram-android/TMessagesProj_AppStandalone/build/outputs/apk -name '*.apk' | head -n 1)
          test -n "$apk" || { echo "::error::no APK was built"; exit 1; }
          mkdir -p out
          cp "$apk" "out/VoidGram-${version}-android.apk"
          ls -la out
          sha256sum out/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: voidgram-android
          path: out/*.apk
          retention-days: 30

      - name: Attach to release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: gh release upload "$TAG" out/*.apk --clobber
