name: VoidGram Desktop (macOS)

# One universal VoidGram.app (Intel x86_64 and Apple Silicon arm64) for macOS 10.13 High Sierra and
# newer: the libraries are built for macOS 10.13 (AyuGram's prepare.py, with its patched Qt for
# High Sierra), so the app runs on Macs from 2012 (up to Catalina) as well as on macOS 26.
# The libraries take hours to build and are cached; a run that hits the time limit saves what it
# built, so run the workflow again to go on. Give a release tag to attach the .dmg to that release.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to attach the .dmg to (leave empty to keep it as an artifact only)
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: desktop-macos
  cancel-in-progress: false

env:
  PREPARE_PATH: "Telegram/build/prepare/prepare.py"

jobs:
  libraries:
    runs-on: macos-15
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          path: voidgram

      - name: Clone AyuGram Desktop and apply the patches.
        run: |
          version="$(cat voidgram/desktop/VERSION)"
          git config --global user.email "ci@voidgram.invalid"
          git config --global user.name "VoidGram CI"
          git clone --depth 1 --branch "$version" https://github.com/AyuGram/AyuGramDesktop.git AyuGramDesktop
          cd AyuGramDesktop
          git submodule update --init --depth=1
          for patch in "$GITHUB_WORKSPACE"/voidgram/desktop/patches/*.patch; do
            git apply --index "$patch"
          done

      - name: First set up.
        run: |
          sudo chown -R `whoami`:admin /usr/local/share || true
          brew update
          brew install automake libtool meson nasm ninja pkg-config
          sudo mdutil -a -i off || true
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache/restore@v4
        with:
          path: |
            Libraries
            ThirdParty
          key: macOS-libs-${{ hashFiles('AyuGramDesktop/Telegram/build/prepare/prepare.py') }}
          restore-keys: macOS-libs-

      # A run that runs out of time still saves what it built, so the next run goes on from there.
      - name: Libraries.
        id: build
        timeout-minutes: 320
        continue-on-error: true
        run: ./AyuGramDesktop/Telegram/build/prepare/mac.sh silent

      - name: Free up some disk space.
        run: find Libraries '(' '(' ! '(' -name '*.a' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' -o -perm +111 ')' -type f ')' -o -empty ')' -delete

      - name: Save the libraries cache.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            Libraries
            ThirdParty
          key: macOS-libs-${{ hashFiles('AyuGramDesktop/Telegram/build/prepare/prepare.py') }}-${{ github.run_id }}

      - name: Stop if the libraries are not finished.
        if: steps.build.outcome != 'success'
        run: |
          echo "::error::The libraries did not finish (time limit or an error). They are cached: run the workflow again to go on."
          exit 1

  app:
    needs: libraries
    runs-on: macos-15
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          path: voidgram

      - name: Clone AyuGram Desktop and apply the patches.
        run: |
          version="$(cat voidgram/desktop/VERSION)"
          git config --global user.email "ci@voidgram.invalid"
          git config --global user.name "VoidGram CI"
          git clone --depth 1 --branch "$version" https://github.com/AyuGram/AyuGramDesktop.git AyuGramDesktop
          cd AyuGramDesktop
          git submodule update --init --depth=1
          for patch in "$GITHUB_WORKSPACE"/voidgram/desktop/patches/*.patch; do
            git apply --index "$patch"
          done

      # The newest Xcode's clang turns two warnings in AyuGram's bundled sqlite_orm.h into errors
      # (pack indexing is a C++2c extension, a variable set but not used) because of -Werror:
      # warnings stay warnings here.
      - name: No -Werror.
        run: sed -i '' '/^        -Werror$/d' AyuGramDesktop/cmake/options_mac.cmake && ! grep -n Werror AyuGramDesktop/cmake/options_mac.cmake

      - name: First set up.
        run: |
          brew update
          brew install automake libtool meson nasm ninja pkg-config
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true

      - name: Libraries cache.
        uses: actions/cache/restore@v4
        with:
          path: |
            Libraries
            ThirdParty
          key: macOS-libs-${{ hashFiles('AyuGramDesktop/Telegram/build/prepare/prepare.py') }}-none
          restore-keys: macOS-libs-
          fail-on-cache-miss: true

      - name: Stub DesktopPrivate.
        run: |
          mkdir -p DesktopPrivate
          random_key() {
            printf -- '-----BEGIN RSA PRIVATE KEY-----\\n%s\\n-----END RSA PRIVATE KEY-----\\n' \
              "$(head -c 96 /dev/urandom | base64 | tr -d '\n')"
          }
          printf 'const char *PrivateKey = "%s";\nconst char *PrivateBetaKey = "%s";\n' \
            "$(random_key)" "$(random_key)" > DesktopPrivate/packer_private.h
          printf 'static const char *AlphaPrivateKey = "%s";\n' \
            "$(random_key)" > DesktopPrivate/alpha_private.h

      # Without Swift (Apple's on-device translation): the Swift 6 build links Apple's Translation framework
      # (macOS 15+) strongly, so it does not even start on older systems ("Не удаётся открыть VoidGram
      # из-за проблемы"), and it needs the Swift runtime copied in for macOS 10.13. The libraries are the same.
      - name: VoidGram build.
        env:
          TDESKTOP_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TDESKTOP_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          cd AyuGramDesktop/Telegram
          defaults write com.apple.dt.Xcode IDEBuildingContinueBuildingAfterErrors -bool YES
          ./configure.sh \
            -D CMAKE_CONFIGURATION_TYPES=Release \
            -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -D CMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -D DESKTOP_APP_MAC_ARCH=${{ matrix.arch }} \
            -D TDESKTOP_API_ID=$TDESKTOP_API_ID \
            -D TDESKTOP_API_HASH=$TDESKTOP_API_HASH \
            -D DESKTOP_APP_SPECIAL_TARGET=mac \
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON \
            -D DESKTOP_APP_DISABLE_SWIFT6=ON
          cmake --build ../out --config Release --parallel

      - name: Pack the half.
        run: |
          cd AyuGramDesktop/out/Release
          ls
          app="$(ls -d *.app | head -n 1)"
          test -n "$app" || { echo "::error::no .app after the build"; exit 1; }
          mkdir -p ../transport
          # A tar: upload-artifact drops the executable bits and symlinks of a bundle.
          tar -cf "../transport/mac-${{ matrix.arch }}.tar" "$app"
          echo "$app" > ../transport/app-name

      - uses: actions/upload-artifact@v4
        with:
          name: voidgram-mac-${{ matrix.arch }}
          path: AyuGramDesktop/out/transport/*
          retention-days: 2

  universal:
    needs: app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: voidgram-mac-x86_64
          path: half/x86_64

      - uses: actions/download-artifact@v4
        with:
          name: voidgram-mac-arm64
          path: half/arm64

      - name: Assemble the universal app.
        run: |
          set -o pipefail
          app="$(bash desktop/ci/assemble-macos.sh | tail -n 1)"
          test -d "$app"
          echo "APP=$app" >> $GITHUB_ENV

      # The packaging of desktop/ci/package-macos.sh: ad hoc signature (no Apple Developer ID, which
      # Apple Silicon does not need to run it), a .dmg, a .zip and checksums. The first start needs a
      # right click, Open, or:  xattr -dr com.apple.quarantine /Applications/VoidGram.app
      - name: Pack.
        run: APP_PATH="$PWD/$APP" DIST_DIR="$PWD/dist" bash desktop/ci/package-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: voidgram-desktop-macos-universal
          path: dist/*
          if-no-files-found: error

      - name: Attach to the release.
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: gh release upload "$TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"
